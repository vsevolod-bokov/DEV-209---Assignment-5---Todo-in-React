<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Todo List</h1>
            <div id="user-info" class="hidden">
                <span id="username-display"></span>
                <button id="logout-btn" type="button">Logout</button>
            </div>
        </header>

        <!-- Message display area -->
        <div id="message" class="message hidden"></div>

        <!-- Auth Section (Register/Login) -->
        <section id="auth-section">
            <div class="auth-tabs">
                <button type="button" class="tab-btn active" data-tab="login">Login</button>
                <button type="button" class="tab-btn" data-tab="register">Register</button>
            </div>

            <!-- Login Form -->
            <form id="login-form" class="auth-form">
                <h2>Login</h2>
                <div class="form-group">
                    <label for="login-username">Username</label>
                    <input type="text" id="login-username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" name="password" required>
                </div>
                <button type="submit" class="btn btn-primary">Login</button>
            </form>

            <!-- Register Form -->
            <form id="register-form" class="auth-form hidden">
                <h2>Register</h2>
                <div class="form-group">
                    <label for="register-username">Username</label>
                    <input type="text" id="register-username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="register-password">Password</label>
                    <input type="password" id="register-password" name="password" required>
                </div>
                <button type="submit" class="btn btn-primary">Register</button>
            </form>
        </section>

        <!-- Todo Section (shown when logged in) -->
        <section id="todo-section" class="hidden">
            <!-- Create Todo Form -->
            <form id="todo-form" class="todo-form">
                <h2>Add New Todo</h2>
                <div class="form-group">
                    <label for="todo-title">Title</label>
                    <input type="text" id="todo-title" name="title" required>
                </div>
                <div class="form-group">
                    <label for="todo-description">Description</label>
                    <textarea id="todo-description" name="description" rows="3"></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Add Todo</button>
            </form>

            <!-- Todo List -->
            <div class="todo-list-container">
                <h2>Your Todos</h2>
                <ul id="todo-list"></ul>
                <p id="no-todos" class="hidden">No todos yet. Add one above!</p>
            </div>
        </section>

        <!-- Edit Todo Modal -->
        <div id="edit-modal" class="modal hidden">
            <div class="modal-content">
                <span class="close-btn">&times;</span>
                <form id="edit-form">
                    <h2>Edit Todo</h2>
                    <input type="hidden" id="edit-todo-id">
                    <div class="form-group">
                        <label for="edit-title">Title</label>
                        <input type="text" id="edit-title" name="title" required>
                    </div>
                    <div class="form-group">
                        <label for="edit-description">Description</label>
                        <textarea id="edit-description" name="description" rows="3"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="edit-status">Status</label>
                        <select id="edit-status" name="status">
                            <option value="false">Unstarted</option>
                            <option value="true">Complete</option>
                        </select>
                    </div>
                    <div class="modal-actions">
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                        <button type="button" class="btn btn-secondary" id="cancel-edit">Cancel</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
